<app-navbar></app-navbar>


<div class="perdida-bg"></div>


    <div class="row"  [@mostrarTriggerCollapse]="estado">
        <div class="col-md-12">
         <div class="text-center"></div>
         <mat-toolbar color="primary"  style=" background-color:rgb(94, 139, 165);  font-size:x-large;"  >
              <span>Pulsera Perdida</span>
              &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
              <img class="rounded" src="../../../assets/logoScout.png" width="60" height="60">
         </mat-toolbar>
         <br>
        </div>
    </div>


  
<div class="d-flex justify-content-center align-items-center">

  <div class="row" >
    <div class="col-md-12">
    <h6 class="text-center">
        <mat-icon matPrefix style="color: purple;" >healing</mat-icon>
        Captura CUM del usuario a sustituir Pulsera  </h6>   <br>        
    <app-modo-captura clave="pulsera-perdida" [(modo)]="modoCaptura"></app-modo-captura>
    <form [formGroup]="formRegistro" (ngSubmit)="saveItem()" >
      <div  [@mostrarTrigger]="estado">
         <div class="campo-escaner">
        <mat-form-field  style="width:100%;" class="neon-shadow"  [subscriptSizing]="modoCaptura==='camara' ? 'dynamic' : 'fixed'">
            <mat-icon matPrefix style="color: purple;" >edit_note</mat-icon>
            <input matInput placeholder="CUM registrado..." type="text" #txtCum formControlName="txtCum" maxlength="10"
                   [readonly]="modoCaptura==='camara'" [attr.inputmode]="modoCaptura==='camara' ? 'none' : null" >
            <mat-error *ngIf="formRegistro.get('txtCum')?.hasError('required')">
                <mat-icon>warning_amber</mat-icon> el CUM es requerido  
             </mat-error>
             <mat-error *ngIf="formRegistro.get('txtCum')?.hasError('minlength')">
                <mat-icon>warning_amber</mat-icon> Debe ser un valor válido 
             </mat-error>
        </mat-form-field>
        <app-boton-escaner *ngIf="modoCaptura==='camara'" (leido)="alEscanear('txtCum', $event)"></app-boton-escaner>
        </div>
      </div>

    
      <table  *ngIf="avisopulsera.length>0" class="table table-sm table-responsive" style="background-color:palevioletred; font-size: small;">
         <thead> </thead>
         <tbody>
          <tr >
            <td rowspan="2" style="text-align: center;"> 
             <img [src]="imagePath" class="img-thumbnail rounded" width="100" height="100" >             
            </td>       
            <td>  <label  class="form label alert alert-success" style="color: white;" *ngIf="avisoTipoPulsera.length>0"
             [ngStyle]="{'background-color': colorTipoPulsera}" > {{ avisoTipoPulsera }}</label>
            </td> 
            <td>   <label *ngIf="this.itemToEdit.idEvento>0" 
              [ngClass]="this.itemToEdit.idEvento ==0? 'form label alert alert-wargning':'form label alert alert-success'"
                  > {{ this.avisopulsera }}</label>  
            </td> 
          </tr>
          <tr>
             <td> 
               <label *ngIf="this.itemToEdit.nombre"
                  [ngClass]="this.idEvento==0? 'form label alert alert-info':'form label alert alert-primary'"
               > <b>Miembro:</b>{{ lblNombre }}. <b>Pulsera Anterior:</b>{{lblPulsera}}.</label>       
             </td>
             <td colspan="2">
               <table 
               class="table table-sm table-striped table-hover"  style="width:80%;"   >
                <tbody>
                   <tr><th>Evento(s):</th></tr>
                   <tr *ngFor="let item of  arrEventos ">
                       <td> <label *ngIf="nombreEvento.length>0" style="font-size: small;" >{{item}}</label></td>
                   </tr> 
                </tbody>
               </table> 
             </td>
           </tr>       
         </tbody>
       </table>
        
         
        <div class="campo-escaner">
        <mat-form-field  style="width:100%;"  [@mostrarTriggerCollapse]="estado" class="neon-shadow"  [subscriptSizing]="modoCaptura==='camara' ? 'dynamic' : 'fixed'">
            <mat-icon matPrefix style="color: purple;" >edit_note</mat-icon>
            <input matInput placeholder="Nueva Pulsera..." type="text" #txtPulsera formControlName="txtPulsera"  maxlength="10"
                   [readonly]="modoCaptura==='camara'" [attr.inputmode]="modoCaptura==='camara' ? 'none' : null" >
             <mat-error *ngIf="formRegistro.get('txtPulsera')?.hasError('required')">
                <mat-icon>warning_amber</mat-icon> Valor de Pulsera es requerida  
             </mat-error>
             <mat-error *ngIf="formRegistro.get('txtPulsera')?.hasError('minlength')">
                <mat-icon>warning_amber</mat-icon> Debe ser un valor válido 
             </mat-error> 
        </mat-form-field>
        <app-boton-escaner *ngIf="modoCaptura==='camara'" (leido)="alEscanear('txtPulsera', $event)"></app-boton-escaner>
        </div>
       
     


     
         <div class="row text-center"  [@mostrarTriggerLeft]="estado" > 
            <div > 
                 <button mat-raised-button style="color:white; " color="accent" [disabled]="formRegistro.invalid" type="submit"  >
                  <i class="fas fa-tools fa-xl efecto-spin" ></i>&nbsp;&nbsp;Guardar</button> 
                  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                  <button mat-raised-button color="basic" [disabled]="formRegistro.invalid"     
                   style="color: rgb(255, 255, 255); background-color:#b76e2e96;" (click)="cleanForm()" >
                   <i class="fa fa-broom fa-xl efecto-slide" ></i>&nbsp;&nbsp;Limpiar Pantalla</button>         
            </div>
         </div>  
    </form>  

    </div>

  </div> 
</div>

  </div>
