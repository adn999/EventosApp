<!-- Barra de pestañas inferior: solo teléfono -->
<nav class="tabbar-telefono" *ngIf="esTelefono && !usaNativo">
  <a *ngFor="let op of dockItems" class="tab" [routerLink]="op.ruta" routerLinkActive="activo"
     [class.con-etiqueta]="etiquetaActiva===op.texto" (click)="playAudio('click'); masAbierto=false; mostrarEtiqueta(op.texto)">
    <i class="fa {{op.icono}}" [style.color]="op.color"></i><span>{{op.texto}}</span>
  </a>
  <button type="button" class="tab" *ngIf="mostrarMas" [class.activo]="masAbierto"
          [class.con-etiqueta]="etiquetaActiva==='Más'" (click)="playAudio('click'); masAbierto=!masAbierto; mostrarEtiqueta('Más')">
    <i class="fa fa-th-large" style="color:rgb(101, 50, 124)"></i><span>Más</span>
  </button>
  <!-- Tableta: "Salir" es siempre la última opción de la barra -->
  <button type="button" class="tab" *ngIf="salirEnDock"
          [class.con-etiqueta]="etiquetaActiva==='Salir'" (click)="playAudio('click'); masAbierto=false; mostrarEtiqueta('Salir'); closeSesion()">
    <i class="fa fa-unlock-alt" style="color:rgb(173, 69, 21)"></i><span>Salir</span>
  </button>
</nav>

<!-- Panel "Más": solo teléfono -->
<div class="mas-fondo" *ngIf="esTelefono && !usaNativo && mostrarMas && masAbierto" (click)="masAbierto=false"></div>
<div class="mas-panel" *ngIf="esTelefono && !usaNativo && mostrarMas && masAbierto">
  <div class="mas-asa"></div>
  <div class="mas-grid">
    <a *ngFor="let op of panelItems" class="mas-item" [routerLink]="op.ruta" routerLinkActive="activo"
       (click)="playAudio('click'); masAbierto=false">
      <i class="fa {{op.icono}}" [style.color]="op.color"></i><span>{{op.texto}}</span>
    </a>
    <button type="button" class="mas-item" *ngIf="!salirEnDock" (click)="masAbierto=false; closeSesion()">
      <i class="fa fa-unlock-alt" style="color:rgb(173, 69, 21)"></i><span>Salir</span>
    </button>
    <!-- iOS: volver a la barra nativa -->
    <button type="button" class="mas-item" *ngIf="esIOS" (click)="playAudio('click'); cambiarMenu(true)">
      <i class="fa fa-mobile-alt" style="color:rgb(101, 50, 124)"></i><span>Menú nativo</span>
    </button>
  </div>
</div>

<!-- Overlay de video de salida -->
<div *ngIf="showExitVideo" class="exit-video-overlay">
  <video #exitVid autoplay playsinline
         class="exit-video" [class.exit-fading]="isExitFading"
         (timeupdate)="onExitVideoTimeUpdate(exitVid)"
         (ended)="onExitVideoEnded()">
    <source src="assets/ScoutExit.mp4" type="video/mp4">
  </video>
</div>
