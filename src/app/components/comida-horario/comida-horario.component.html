<app-navbar></app-navbar>

<div class="eats-bg"></div>

<div class="jumbotron mx-3 ">
    <h3 class="display-6 text-center neon-shadow" >Horario de Comida</h3>
    <hr>
    <div class="row">
        <div class="col-md-6">
            <h6 class="text-center">Listado de Horarios</h6>
            <div class="my-2">
               <!--  <mat-form-field >
                    <input matInput placeholder="Buscar..."  [(ngModel)]="strCriterio" >
                    <mat-icon matPrefix >search</mat-icon>
                  </mat-form-field> -->
              <div class="input-group mb-3">
               <span class="input-group-text" id="addonSearch"><mat-icon matPrefix >search</mat-icon></span>
               <input type="text" class="form-control"placeholder="Buscar..." aria-describedby="addonSearch" 
                 [(ngModel)]="strCriterio"/>
              </div>
   
            </div>
            <table class="table table-striped table-hover">
             <thead>
                <tr><th>Id</th><th>Descripcion</th><th>Hora Inicial</th><th>Hora Final</th></tr>
             </thead>
             <tbody>
                <tr *ngFor="let item of   this.listItems | jsonFilterBy:[this.strCriterio,'descripcion'] | slice:desde:hasta ">
                    <th>{{item.idComida_Horario}}</th>
                     <td>{{item.descripcion}}</td>
                     <td>{{item.hora_inicial}}</td>
                     <td>{{item.hora_final}}</td>
                    <td>
                        <button mat-mini-fab color="primary" type="button" (click)="editItem(item);" class="neon-shadow" >
                        <i class="fas fa-edit efecto-spin " ></i> </button>
                    </td>
                    <!-- <td>
                         <i class="far fa-trash-alt fa-lg text-danger" (click)="eliminarTarjeta(item.idAgrupador)" style="cursor:pointer;"></i> 
                    </td> -->
                </tr> 
             </tbody>
            </table> 
            <mat-paginator [length]="this.listItems.length"
              [pageSize]="pageSize"  [pageSizeOptions]="[25,50,100]"
              (page)="cambiarPagina($event)"
              aria-label="Select page">
            </mat-paginator>

        </div>
        <div class="col-md-6">
            <h6 class="text-center">Editar Horario de Comida </h6>           
            <form [formGroup]="formcatComidaHorario" (ngSubmit)="saveItem()" >
                <div class="form-group">
                    <div class="input-group mb-3">
                        <div class="input-group-prepend">
                            <div class="input-group-text bg-white">
                                <mat-icon>draw</mat-icon>
                                <!-- <i class="fa-solid fa-feather fa-xl" ></i> -->
                            </div>
                        </div>
                         <input type="text" class="form-control" placeholder="id" 
                        #txtidComida_Horario formControlName="idComida_Horario" /> 

                        <input type="text" class="form-control" placeholder="descripcion" 
                        #txtdescripcion formControlName="descripcion" /> 

                           <input type="text" class="form-control" placeholder="Hora Inicial en Hrs." 
                        #txthora_inicial formControlName="hora_inicial" /> 

                           <input type="text" class="form-control" placeholder="Hora Final en Hrs." 
                        #txthora_final formControlName="hora_final" /> 
                    </div>
                </div>
          
                <div class="row text-center" >
                    <div>
                        <!-- disabled deshabilita si no cumple todos los req del controlador component -->
                       <!--  <button class="btn btn-outline-success  " [disabled]="formQuizz.invalid" type="submit">
                             <i class="fas fa-database"></i> Guardar</button>   -->  
                         <button mat-raised-button color="accent" [disabled]="formcatComidaHorario.invalid" type="submit">
                         <i class="fas fa-stopwatch fa-xl efecto-spin" ></i>&nbsp;&nbsp;Guardar</button> 
                        
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
