<app-navbar></app-navbar>


<div class="kit-bg"></div>

    <div class="row"[@mostrarTriggerCollapse]="estado" >
        <div class="col-md-12">
         <div class="text-center"></div>
         <mat-toolbar color="primary"  style=" background-color:rgb(94, 139, 165);  font-size:x-large;"  >
         <span>Kit Evento</span>
          &nbsp;&nbsp;&nbsp;&nbsp;
          <img class="rounded" src="../../../assets/logoScout.png" width="60" height="60">
         </mat-toolbar>
         <br>
        </div>
    </div>

 
  <div class="d-flex justify-content-center align-items-center"> 
   <div class="row mx-0 w-100" >

    <div class="col-12">
    <h6 class="text-center">
        <mat-icon matPrefix style="color: purple;" >shopping_cart</mat-icon>
        Registrar Kit </h6><br>
    <app-modo-captura clave="kit" [(modo)]="modoCaptura"></app-modo-captura>
    <form [formGroup]="formRegistro" (ngSubmit)="saveItem()" >
        
        <div class="campo-escaner">
        <mat-form-field  style="width:100%; max-width:240px;"  [@mostrarTrigger]="estado" class="neon-shadow"  [subscriptSizing]="modoCaptura==='camara' ? 'dynamic' : 'fixed'">
            <mat-icon matPrefix style="color: purple;" >edit_note</mat-icon>
            <input matInput placeholder="Pulsera" type="text" #txtPulsera formControlName="txtPulsera"  maxlength="10" minlength="10"
                   [readonly]="modoCaptura==='camara'" [attr.inputmode]="modoCaptura==='camara' ? 'none' : null" >
             <mat-error *ngIf="formRegistro.get('txtPulsera')?.hasError('minlength')">
                <mat-icon>warning_amber</mat-icon> Debe ser un valor válido 
             </mat-error> 
        </mat-form-field>
        <app-boton-escaner *ngIf="modoCaptura==='camara'" etiqueta="Escaneo continuo" titulo="Kit · escaneo continuo" [procesar]="procesarContinuo"></app-boton-escaner>
        </div>


        <table  *ngIf="avisoPulsera.length>0" class="table table-borderless table-striped tabla-datos" style="background-color:palevioletred;">
          <thead> </thead>
          <tbody>
           <tr>
             <td rowspan="2" style="text-align: center;"> <img [src]="imagePath" class="img-thumbnail rounded" width="100" height="100" >     
                <br>
                <label  class="form label alert alert-success" style="color: white;" *ngIf="avisoTipoPulsera.length>0"
                [ngStyle]="{'background-color': colorTipoPulsera}" > {{ avisoTipoPulsera }}</label>
             </td>        
             <td>  <label *ngIf="avisoPulsera.length>0" [ngClass]="this.validacionGral!? 'form label alert alert-success':'form label alert alert-warning'"
                    > {{ avisoPulsera }}</label>
             </td>
             <td> <label *ngIf="this.itemToEdit.idEvento>0" class="form label alert alert-info" > 
                   <span *ngIf="this.itemToEdit.idEvento>0 && this.itemToEdit.kit==1 ">    <mat-icon>card_giftcard</mat-icon>&nbsp; Tiene Kit Entregado!</span>
                  </label> 
             </td>
           </tr>
           <tr>
              <td> 
                <label  [ngClass]="this.validacionGral!? 'form label alert alert-success':'form label alert alert-primary'"
                > &#x2022;<b>Pulsera:</b> {{ lblPulsera }} <br>  &#x2022;<b>CUM:</b> {{lblCum}}<br> &#x2022;<b>Nombre:</b>{{lblNombre}}</label>       
              </td>
              <td colspan="2">
                <table 
                class="table table-sm table-striped table-hover tabla-eventos"  style="width:80%"   >
                 <tbody>
                    <tr><th>Evento(s):</th></tr>
                    <tr *ngFor="let item of  arrEventos ">
                        <td> <label *ngIf="nombreEvento.length>0" style="font-size: small;" >{{item}}</label></td>
                    </tr> 
                 </tbody>
                </table> 
              </td>
            </tr>       
          </tbody>
        </table>

    
 

   
      
      


     
         <div class="row text-center"  [@mostrarTriggerLeft]="estado" > 
            <div class="fila-botones"> 
                 <button mat-raised-button style="color:white; " color="accent" [disabled]="formRegistro.invalid" type="submit"  >
               <i class="fas fa-shopping-bag efecto-spin"></i> &nbsp;Registrar</button>
                  <button mat-raised-button color="basic"      
                   style="color: rgb(254, 252, 254); background-color:#b76e2e96;" (click)="cleanForm()" >
                   <i class="fa fa-broom efecto-slide" ></i>&nbsp;Limpiar Pantalla</button>         
            </div>
         </div>  
    </form>  

    </div>

   </div>
